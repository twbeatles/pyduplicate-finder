[package]
name = "pydup_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust core for PyDuplicate Finder Pro"
authors = ["PyDuplicate Finder Team"]
license = "MIT OR Apache-2.0"

[lib]
name = "pydup_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
blake2 = "0.11"
digest = "0.11"
rayon = "1.12"
globset = "0.4"
same-file = "1.0"

[dev-dependencies]
tempfile = "3.12"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
