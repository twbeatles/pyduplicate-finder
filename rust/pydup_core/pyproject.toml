[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pydup_core"
version = "0.1.0"
description = "Native Rust core for PyDuplicate Finder Pro"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "pydup_core"
binding = "pyo3"
manifest-path = "Cargo.toml"
